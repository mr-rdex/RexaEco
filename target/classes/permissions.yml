    default: true
  rexaeco.xpcek:
    description: "XP çekme izni"
    default: true
  rexaeco.paracek:
    description: "Para çekme izni"
    default: true
  rexaeco.sell:
    description: "Satış menüsü izni"
    default: true
  rexaeco.admin.sellwand:
    description: "Satış çubuğu verme izni"
    default: op
  rexaeco.admin:
    description: "Admin komutlarına erişim izni"
    default: op